[package]
name = "pingkit"
description = "A（async-ping）和 B（raw-ping）共用的一切：参数、数据面初始化/关停与泄漏核对、发送函数（段①）、TimerHeap、直方图、统计报表、进度上报线程。"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dpdk = { path = "../dpdk" }
pingproto = { path = "../pingproto" }
timerq = { path = "../timerq" }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 诊断：把段①拆成 取 mbuf / 写包 / tx_burst，并按发送队列位置统计慢 tx_burst。默认关闭（会多两次时钟读取）。
probe = []
# 故障注入钩子：让发送在指定的时间段内持续失败（环境变量 BQ_FAULT_TX，见 sender.rs）。默认关闭——
# 正式的可执行文件里没有这段代码；只有 scripts/fault.py 为"发送持续失败"那几个场景单独编译的版本打开它。
fault = []
