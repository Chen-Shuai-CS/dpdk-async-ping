[package]
name = "raw-ping"
description = "B：手写 busy-poll 循环 + session 状态表实现的 ICMP ping。没有 executor、没有 Waker、没有 async task。A 的对照组。"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "raw-ping"
path = "src/main.rs"

[dependencies]
dpdk = { path = "../dpdk" }
pingproto = { path = "../pingproto" }
pingkit = { path = "../pingkit" }
serde_json = "1"

[features]
# 诊断：见 pingkit 的 probe 特性
probe = ["pingkit/probe"]
# 故障注入钩子：见 pingkit 的 fault 特性
fault = ["pingkit/fault"]
